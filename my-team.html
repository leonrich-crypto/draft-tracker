<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Draft Tracker · My Team</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link rel="stylesheet" href="styles.css?v=1787272965" />
</head>
<body>

<header class="scoreboard">
  <div class="scoreboard-inner">
    <div class="scoreboard-top">
      <div class="wordmark"><i class="fas fa-football" style="color:var(--amber)"></i> Draft Tracker <span class="down">Live Board</span></div>
      <nav class="nav">
        <a href="index.html"><i class="fas fa-list"></i>All Players</a>
        <a href="by-position.html"><i class="fas fa-layer-group"></i>By Position</a>
        <a href="injury-report.html"><i class="fas fa-notes-medical"></i>Injuries</a>
        <a href="my-team.html" class="active"><i class="fas fa-user-shield"></i>My Team</a>
        <a href="teams.html"><i class="fas fa-people-group"></i>Teams</a>
        <a href="sleepers.html"><i class="fas fa-star"></i>Sleepers</a>
      </nav>
    </div>
    <div class="page-title">Your drafted roster, auto-slotted into a starting lineup</div>
    <div class="roster-summary-bar" id="summaryBar"></div>
  </div>
  <div class="scoreboard-ticks"></div>
</header>

<div class="app">
  <div class="panel" id="sleeperPanel" style="margin-bottom:1.2rem;"></div>

  <div class="panel">
    <div class="roster-heading"><i class="fas fa-star"></i>Starters</div>
    <div class="starters-grid" id="startersList"></div>

    <div class="roster-heading"><i class="fas fa-users"></i>Bench</div>
    <div class="bench-list" id="benchList"></div>

    <div class="footer-note">
      <span><i class="fas fa-circle-check"></i> Starters auto-fill with your best drafted player at each slot, ranked by 2026 projection</span>
      <span><a href="index.html">Go draft more players &rarr;</a></span>
    </div>
  </div>
</div>

<script src="data.js?v=1787272965"></script>
<script src="store.js?v=1787272965"></script>
<script src="sleeper-sync.js?v=1787272965"></script>
<script>
// Starting lineup shape. FLEX accepts WR/RB/TE.
const STARTING_SLOTS = [
  { label: 'QB',   accepts: ['QB'] },
  { label: 'RB',   accepts: ['RB'] },
  { label: 'RB',   accepts: ['RB'] },
  { label: 'WR',   accepts: ['WR'] },
  { label: 'WR',   accepts: ['WR'] },
  { label: 'TE',   accepts: ['TE'] },
  { label: 'FLEX', accepts: ['WR', 'RB', 'TE'] },
  { label: 'FLEX', accepts: ['WR', 'RB', 'TE'] },
  { label: 'K',    accepts: ['K'] },
  { label: 'DEF',  accepts: ['DEF'] },
];

function qualityScore(p) {
  // Prefer real 2026 projection; fall back to 2025 actuals; else 0.
  if (p.projPts > 0) return p.projPts;
  if (p.pts > 0) return p.pts;
  return 0;
}

function renderSlot(label, player) {
  if (!player) {
    const needs = label === 'FLEX' ? 'a WR, RB, or TE' : 'a ' + label;
    return `
      <div class="roster-slot is-empty">
        <div class="slot-tag tag-${label}" style="background:transparent;border:2px dashed var(--amber);color:var(--amber);box-shadow:none;">${label}</div>
        <div class="slot-body"><span class="slot-empty"><i class="fas fa-hand-sparkles"></i>Waiting on ${needs} — go draft one!</span></div>
      </div>
    `;
  }
  const proj = player.projPts > 0 ? player.projPts.toFixed(1) : '—';
  return `
    <div class="roster-slot is-filled">
      <div class="slot-tag tag-${label}">${label}</div>
      <div class="slot-body">
        <div class="slot-player-name">${player.player}</div>
        <div class="slot-player-meta">${player.pos} &middot; ${player.team}${SLEEPER_NAMES.has(player.player) ? ' &middot; <i class="fas fa-star sleeper-flag"></i> Sleeper' : ''}</div>
      </div>
      <div class="slot-stat"><span class="stat-value">${proj}</span><span class="stat-label">2026 proj</span></div>
    </div>
  `;
}

function renderBenchRow(player) {
  const proj = player.projPts > 0 ? player.projPts.toFixed(1) : '—';
  return `
    <div class="bench-row">
      <div class="slot-tag tag-BN">BN</div>
      <span class="pos-badge pos-${player.pos}" style="width:1.6rem;height:1.6rem;font-size:0.6rem;">${player.pos}</span>
      <div class="slot-body">
        <span class="slot-player-name" style="font-size:0.9rem;">${player.player}</span>
        <span class="slot-player-meta">${player.team}${SLEEPER_NAMES.has(player.player) ? ' &middot; <i class="fas fa-star sleeper-flag"></i>' : ''}</span>
      </div>
      <div class="slot-stat" style="background:transparent;color:var(--ink-soft);"><span class="stat-value" style="color:var(--ink);">${proj}</span><span class="stat-label">proj</span></div>
    </div>
  `;
}

function render() {
  const cfg = getSleeperConfig();
  // If a Sleeper league is connected, "my team" = picks Sleeper attributes to me.
  // Otherwise fall back to the original manual-checkbox behavior (anyone drafted = mine).
  const drafted = (cfg && cfg.draftId) ? getMyPicksSet() : getDraftedSet();
  const startersList = document.getElementById('startersList');
  const benchList = document.getElementById('benchList');
  const summaryBar = document.getElementById('summaryBar');

  // Build the pool of drafted player objects, best-quality-first within each position.
  const pool = PLAYERS.filter(p => drafted.has(p.player));
  pool.sort((a, b) => qualityScore(b) - qualityScore(a));

  const used = new Set();
  const filledSlots = STARTING_SLOTS.map(slot => {
    const candidate = pool.find(p => !used.has(p.id) && slot.accepts.includes(p.pos));
    if (candidate) used.add(candidate.id);
    return { label: slot.label, player: candidate || null };
  });

  const bench = pool.filter(p => !used.has(p.id));

  startersList.innerHTML = filledSlots.map(s => renderSlot(s.label, s.player)).join('');

  if (bench.length === 0) {
    benchList.innerHTML = `<div class="roster-slot is-empty"><div class="slot-tag tag-BN">BN</div><div class="slot-body"><span class="slot-empty"><i class="fas fa-circle-info"></i>No bench players yet</span></div></div>`;
  } else {
    benchList.innerHTML = bench.map(p => renderBenchRow(p)).join('');
  }

  const filledCount = filledSlots.filter(s => s.player).length;
  summaryBar.innerHTML = `
    <div class="digit-card"><span class="digit">${filledCount}/${STARTING_SLOTS.length}</span><span class="digit-label">Starters Filled</span></div>
    <div class="digit-card"><span class="digit">${bench.length}</span><span class="digit-label">On Bench</span></div>
    <div class="digit-card"><span class="digit">${pool.length}</span><span class="digit-label">Total Drafted</span></div>
  `;
}

// ---------- Sleeper connect panel ----------

const sleeperPanel = document.getElementById('sleeperPanel');
let foundLeagues = [];

function timeAgo(ts) {
  if (!ts) return 'never';
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return s + 's ago';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  return Math.floor(s / 3600) + 'h ago';
}

function renderSleeperPanel() {
  const cfg = getSleeperConfig();

  if (cfg && cfg.draftId) {
    const needsUsername = !cfg.userId;
    sleeperPanel.innerHTML = `
      <div class="toolbar" style="justify-content:space-between; margin-bottom:0.6rem;">
        <div>
          <strong><i class="fas fa-satellite-dish" style="color:var(--field);"></i> Connected: ${cfg.leagueName || 'Sleeper League'}</strong>
          <span class="chip chip-ok" style="margin-left:0.5rem;">${cfg.status || 'synced'}</span>
        </div>
        <div style="display:flex; gap:0.5rem;">
          <button class="btn" id="syncNowBtn"><i class="fas fa-rotate"></i> Sync now</button>
          <button class="btn btn-quiet" id="disconnectBtn"><i class="fas fa-link-slash"></i> Disconnect</button>
        </div>
      </div>
      ${needsUsername ? `
        <div class="toolbar" style="background:var(--amber-soft); border-radius:8px; padding:0.6rem 0.8rem;">
          <span style="font-size:0.85rem; flex:1;"><i class="fas fa-circle-info"></i> The whole board is syncing, but I don't know which picks are yours yet. Add your username so My Team fills in correctly:</span>
          <input type="text" id="tagUsername" placeholder="Your Sleeper username" style="min-width:160px;" />
          <button class="btn" id="tagUsernameBtn">Set</button>
        </div>
      ` : ''}
      <div class="footer-note" style="margin-top:0.6rem;">
        <span>Last synced ${timeAgo(cfg.lastSyncedAt)} &middot; ${cfg.matchedPicks || 0}/${cfg.totalPicks || 0} picks matched to players &middot; polling every 15s</span>
      </div>
    `;
    document.getElementById('syncNowBtn').addEventListener('click', async () => {
      const btn = document.getElementById('syncNowBtn');
      btn.disabled = true;
      await sleeperSyncOnce();
      renderSleeperPanel();
    });
    document.getElementById('disconnectBtn').addEventListener('click', () => {
      if (confirm('Disconnect this Sleeper league? Your board stays as-is, but it will stop auto-updating.')) {
        stopSleeperPolling();
        clearSleeperConfig();
        renderSleeperPanel();
      }
    });
    if (needsUsername) {
      document.getElementById('tagUsernameBtn').addEventListener('click', async () => {
        const uname = document.getElementById('tagUsername').value.trim();
        if (!uname) return;
        try {
          const user = await sleeperLookupUser(uname);
          const c = getSleeperConfig();
          c.userId = user.user_id;
          if (!c.teams || Object.keys(c.teams).length === 0) {
            c.teams = await sleeperBuildTeamsMap(c.leagueId).catch(() => ({}));
          }
          setSleeperConfig(c);
          await sleeperSyncOnce();
          renderSleeperPanel();
        } catch (e) {
          alert(e.message || 'Could not find that username.');
        }
      });
    }
    return;
  }

  sleeperPanel.innerHTML = `
    <div style="margin-bottom:0.8rem;">
      <strong><i class="fab fa-hire-a-helper" style="color:var(--field);"></i> Connect your Sleeper league</strong>
      <div style="font-size:0.85rem; color:var(--ink-soft); margin-top:0.2rem;">Paste your league URL, or search by username — picks sync automatically as they happen.</div>
    </div>
    <div class="toolbar">
      <input type="text" id="sleeperLeagueUrl" placeholder="Paste a Sleeper league or draft URL/ID" style="flex:1; min-width:220px;" />
      <button class="btn" id="connectByUrlBtn"><i class="fas fa-link"></i> Connect this league</button>
    </div>
    <div style="font-size:0.8rem; color:var(--ink-soft); margin:0.6rem 0 0.3rem;">— or —</div>
    <div class="toolbar">
      <input type="text" id="sleeperUsername" placeholder="Your Sleeper username" style="flex:1; min-width:180px;" />
      <button class="btn" id="findLeaguesBtn"><i class="fas fa-magnifying-glass"></i> Find leagues</button>
    </div>
    <div style="font-size:0.78rem; color:var(--ink-soft); margin-top:0.3rem;">Searching by username also tags which picks are yours, so My Team fills in correctly. The URL option marks the whole board but can't tell your picks apart from your opponents' — add your username afterward if you want that.</div>
    <div id="sleeperLeagueResults"></div>
    <div id="sleeperError" style="color:var(--flag); font-size:0.85rem; margin-top:0.4rem;"></div>
  `;

  document.getElementById('findLeaguesBtn').addEventListener('click', findLeagues);
  document.getElementById('sleeperUsername').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') findLeagues();
  });
  document.getElementById('connectByUrlBtn').addEventListener('click', connectByUrl);
  document.getElementById('sleeperLeagueUrl').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') connectByUrl();
  });
}

function extractLeagueId(input) {
  // Kept for the placeholder/validation hint only — actual parsing now
  // happens in resolveSleeperConnection, which also understands draft URLs.
  return parseSleeperInput(input);
}

async function connectByUrl() {
  const input = document.getElementById('sleeperLeagueUrl').value;
  const errorBox = document.getElementById('sleeperError');
  errorBox.textContent = '';

  const btn = document.getElementById('connectByUrlBtn');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Connecting...';

  try {
    const resolved = await resolveSleeperConnection(input);
    let teams = {};
    if (resolved.leagueId) {
      teams = await sleeperBuildTeamsMap(resolved.leagueId).catch(() => ({}));
    }
    setSleeperConfig({
      leagueId: resolved.leagueId,
      draftId: resolved.draftId,
      leagueName: resolved.leagueName,
      status: resolved.status,
      userId: null, // unknown until they also search by username
      teams,
    });
    startSleeperPolling();
    renderSleeperPanel();
  } catch (e) {
    errorBox.textContent = e.message || 'Something went wrong connecting that.';
  }

  btn.disabled = false;
  btn.innerHTML = '<i class="fas fa-link"></i> Connect this league';
}

async function findLeagues() {
  const username = document.getElementById('sleeperUsername').value.trim();
  const errorBox = document.getElementById('sleeperError');
  const resultsBox = document.getElementById('sleeperLeagueResults');
  errorBox.textContent = '';
  resultsBox.innerHTML = '';
  if (!username) { errorBox.textContent = 'Enter a username first.'; return; }

  const btn = document.getElementById('findLeaguesBtn');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Searching...';

  try {
    const user = await sleeperLookupUser(username);
    const season = new Date().getMonth() >= 1 ? new Date().getFullYear() : new Date().getFullYear() - 1;
    const leagues = await sleeperFetchLeagues(user.user_id, season);

    if (!leagues || leagues.length === 0) {
      errorBox.textContent = `No ${season} NFL leagues found for "${username}".`;
    } else {
      foundLeagues = leagues.map(l => ({ ...l, _userId: user.user_id }));
      resultsBox.innerHTML = `
        <div class="table-wrap" style="margin-top:0.8rem;">
          <table>
            <thead><tr><th>League</th><th>Status</th><th>Teams</th><th style="width:1%;"></th></tr></thead>
            <tbody>
              ${foundLeagues.map((l, i) => `
                <tr>
                  <td><span class="player-name">${l.name}</span></td>
                  <td><span class="chip ${l.status === 'complete' ? 'chip-ok' : l.status === 'drafting' ? 'chip-amber' : 'chip-flag'}">${l.status}</span></td>
                  <td class="num">${l.total_rosters}</td>
                  <td><button class="btn" data-idx="${i}">Connect</button></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
      resultsBox.querySelectorAll('button[data-idx]').forEach(b => {
        b.addEventListener('click', () => connectLeague(foundLeagues[parseInt(b.dataset.idx, 10)]));
      });
    }
  } catch (e) {
    errorBox.textContent = e.message || 'Something went wrong looking that up.';
  }

  btn.disabled = false;
  btn.innerHTML = '<i class="fas fa-magnifying-glass"></i> Find leagues';
}

function connectLeague(league) {
  if (!league.draft_id) {
    document.getElementById('sleeperError').textContent = 'This league has no draft set up yet on Sleeper.';
    return;
  }
  sleeperBuildTeamsMap(league.league_id).catch(() => ({})).then((teams) => {
    setSleeperConfig({
      leagueId: league.league_id,
      draftId: league.draft_id,
      leagueName: league.name,
      status: league.status,
      userId: league._userId,
      teams,
    });
    startSleeperPolling();
    renderSleeperPanel();
  });
}

onSleeperSyncTick(() => { renderSleeperPanel(); render(); });
onSleeperConfigChange(renderSleeperPanel);
onMyPicksChange(render);
onDraftStoreChange(render);
renderSleeperPanel();
render();
</script>
</body>
</html>
