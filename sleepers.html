<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Draft Tracker · Sleepers</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="scoreboard">
  <div class="scoreboard-inner">
    <div class="scoreboard-top">
      <div class="wordmark"><i class="fas fa-football" style="color:var(--amber)"></i> Draft Tracker <span class="down">Live Board</span></div>
      <nav class="nav">
        <a href="index.html"><i class="fas fa-list"></i>All Players</a>
        <a href="by-position.html"><i class="fas fa-layer-group"></i>By Position</a>
        <a href="injury-report.html"><i class="fas fa-notes-medical"></i>Injuries</a>
        <a href="my-team.html"><i class="fas fa-user-shield"></i>My Team</a>
        <a href="sleepers.html" class="active"><i class="fas fa-star"></i>Sleepers</a>
      </nav>
    </div>
    <div class="page-title">Late-round scouting notes, grouped by position</div>
    <div style="margin-top:0.6rem;font-size:0.78rem;color:var(--chalk-dim);font-family:var(--font-mono);"><i class="fas fa-satellite-dish"></i> Pulled from live training-camp coverage &middot; snapshot taken Aug 20, 2026</div>
  </div>
  <div class="scoreboard-ticks"></div>
</header>

<div class="app">
  <div class="panel">
    <div class="pos-tabs" id="posTabs"></div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th style="width:2.5rem;"></th>
            <th>Player</th>
            <th>Team</th>
            <th>Category</th>
            <th>Why</th>
            <th>Risk</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
    <div class="footer-note">
      <span id="posSummary"></span>
      <span><i class="fas fa-circle-check"></i> Synced with the main board</span>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script src="store.js"></script>
<script>
const posTabs = document.getElementById('posTabs');
const tbody = document.getElementById('tableBody');
const posSummary = document.getElementById('posSummary');

const SLEEPER_POSITIONS = POSITION_ORDER.filter(pos => SLEEPERS.some(s => s.pos === pos));
let activePos = SLEEPER_POSITIONS[0];

function renderTabs() {
  const drafted = getDraftedSet();
  posTabs.innerHTML = SLEEPER_POSITIONS.map(pos => {
    const group = SLEEPERS.filter(s => s.pos === pos);
    const left = group.filter(s => !drafted.has(s.player)).length;
    return `<button class="pos-tab ${pos === activePos ? 'active' : ''}" data-pos="${pos}">
      ${pos} <span class="count">${left}/${group.length} left</span>
    </button>`;
  }).join('');

  posTabs.querySelectorAll('.pos-tab').forEach(btn => {
    btn.addEventListener('click', () => { activePos = btn.dataset.pos; render(); });
  });
}

function render() {
  renderTabs();
  const drafted = getDraftedSet();
  const group = SLEEPERS.filter(s => s.pos === activePos);

  if (group.length === 0) {
    tbody.innerHTML = `<tr><td colspan="6"><div class="empty-state"><i class="fas fa-clipboard-question"></i>No sleepers tracked at this position.</div></td></tr>`;
  } else {
    tbody.innerHTML = group.map(s => {
      const isDrafted = drafted.has(s.player);
      return `
        <tr class="${isDrafted ? 'is-drafted' : ''}">
          <td><input type="checkbox" class="draft-check" data-name="${s.player.replace(/"/g,'&quot;')}" ${isDrafted ? 'checked' : ''} /></td>
          <td><span class="player-name"><i class="fas fa-star sleeper-flag"></i> ${s.player}</span></td>
          <td>${s.team}</td>
          <td><span class="chip chip-amber">${s.category}</span></td>
          <td style="max-width:280px;">${s.upside}</td>
          <td style="max-width:220px;color:var(--flag);">${s.risk}</td>
        </tr>
      `;
    }).join('');
  }

  const total = group.length;
  const draftedInGroup = group.filter(s => drafted.has(s.player)).length;
  posSummary.textContent = `${activePos} sleepers: ${draftedInGroup} drafted, ${total - draftedInGroup} still available`;

  tbody.querySelectorAll('.draft-check').forEach(cb => {
    cb.addEventListener('change', function () {
      setPlayerDrafted(this.dataset.name, this.checked);
    });
  });
}

onDraftStoreChange(render);
render();
</script>
</body>
</html>
