<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Draft Tracker · Sleepers</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="scoreboard">
  <div class="scoreboard-inner">
    <div class="scoreboard-top">
      <div class="wordmark"><i class="fas fa-football" style="color:var(--amber)"></i> Draft Tracker <span class="down">Live Board</span></div>
      <nav class="nav">
        <a href="index.html"><i class="fas fa-list"></i>All Players</a>
        <a href="by-position.html"><i class="fas fa-layer-group"></i>By Position</a>
        <a href="injury-report.html"><i class="fas fa-notes-medical"></i>Injuries</a>
        <a href="sleepers.html" class="active"><i class="fas fa-star"></i>Sleepers</a>
      </nav>
    </div>
    <div class="page-title">Late-round scouting notes</div>
  </div>
  <div class="scoreboard-ticks"></div>
</header>

<div class="app">
  <div id="sleeperGrid" class="card-grid"></div>
</div>

<script src="data.js"></script>
<script src="store.js"></script>
<script>
const grid = document.getElementById('sleeperGrid');

function render() {
  const drafted = getDraftedSet();

  grid.innerHTML = SLEEPERS.map(s => {
    const isDrafted = drafted.has(s.player);
    const stamp = isDrafted ? '<div class="stamp">Drafted</div>' : '';
    return `
      <div class="card ${isDrafted ? 'is-drafted' : ''}">
        ${stamp}
        <h3><i class="fas fa-star" style="color:var(--amber);"></i> ${s.player}</h3>
        <div class="meta">
          <span class="pos-badge pos-${s.pos}" style="width:1.5rem;height:1.5rem;font-size:0.6rem;vertical-align:middle;">${s.pos}</span>
          ${s.team} · ${s.round}
        </div>
        <span class="chip chip-amber">${s.category}</span>
        <div class="upside"><i class="fas fa-arrow-up"></i>${s.upside}</div>
        <div class="risk-line"><i class="fas fa-triangle-exclamation"></i>${s.risk}</div>
        <div class="draft-toggle">
          <label>
            <input type="checkbox" class="draft-check" data-name="${s.player.replace(/"/g,'&quot;')}" ${isDrafted ? 'checked' : ''} />
            Mark drafted
          </label>
        </div>
      </div>
    `;
  }).join('');

  grid.querySelectorAll('.draft-check').forEach(cb => {
    cb.addEventListener('change', function () {
      setPlayerDrafted(this.dataset.name, this.checked);
    });
  });
}

onDraftStoreChange(render);
render();
</script>
</body>
</html>
