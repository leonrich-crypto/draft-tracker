<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Draft Tracker · All Players</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="scoreboard">
  <div class="scoreboard-inner">
    <div class="scoreboard-top">
      <div class="wordmark"><i class="fas fa-football" style="color:var(--amber)"></i> Draft Tracker <span class="down">Live Board</span></div>
      <nav class="nav">
        <a href="index.html" class="active"><i class="fas fa-list"></i>All Players</a>
        <a href="by-position.html"><i class="fas fa-layer-group"></i>By Position</a>
        <a href="injury-report.html"><i class="fas fa-notes-medical"></i>Injuries</a>
        <a href="sleepers.html"><i class="fas fa-star"></i>Sleepers</a>
      </nav>
    </div>
    <div class="scoreboard-stats">
      <div class="digit-card"><span class="digit" id="totalCount">0</span><span class="digit-label">Players</span></div>
      <div class="digit-card"><span class="digit" id="draftedCount">0</span><span class="digit-label">Drafted</span></div>
      <div class="digit-card"><span class="digit" id="undraftedCount">0</span><span class="digit-label">Available</span></div>
      <div class="digit-card"><span class="digit" id="sleeperCount">0</span><span class="digit-label">Sleepers Drafted</span></div>
    </div>
  </div>
  <div class="scoreboard-ticks"></div>
</header>

<div class="app">
  <div class="panel">
    <div class="toolbar">
      <input type="text" id="searchInput" placeholder="Search player, team, or position" style="flex:1; min-width:200px;" />
      <select id="filterStatus">
        <option value="all">All players</option>
        <option value="drafted">Drafted only</option>
        <option value="undrafted">Available only</option>
      </select>
      <select id="filterPos">
        <option value="all">All positions</option>
        <option value="QB">QB</option>
        <option value="RB">RB</option>
        <option value="WR">WR</option>
        <option value="TE">TE</option>
        <option value="K">K</option>
      </select>
      <button class="btn" id="resetBtn"><i class="fas fa-undo-alt"></i> Reset board</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th style="width:2.5rem;"></th>
            <th>Pos</th>
            <th>Player</th>
            <th>Team</th>
            <th class="num">Rank</th>
            <th class="num">Total Pts</th>
            <th class="num">PPG</th>
            <th>Notes</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <div class="footer-note">
      <span><i class="fas fa-circle-check"></i> Pts/PPG are real 2025 season totals (PPR) &middot; 0.0 = no 2025 NFL action (rookie, injury, etc.)</span>
      <span id="lastUpdated"></span>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script src="store.js"></script>
<script>
const tbody = document.getElementById('tableBody');
const searchInput = document.getElementById('searchInput');
const filterStatus = document.getElementById('filterStatus');
const filterPos = document.getElementById('filterPos');
const resetBtn = document.getElementById('resetBtn');
const totalCount = document.getElementById('totalCount');
const draftedCount = document.getElementById('draftedCount');
const undraftedCount = document.getElementById('undraftedCount');
const sleeperCount = document.getElementById('sleeperCount');
const lastUpdated = document.getElementById('lastUpdated');

function render() {
  const drafted = getDraftedSet();
  const search = searchInput.value.toLowerCase().trim();
  const status = filterStatus.value;
  const pos = filterPos.value;

  let filtered = PLAYERS.filter(p => {
    const isDrafted = drafted.has(p.player);
    if (status === 'drafted' && !isDrafted) return false;
    if (status === 'undrafted' && isDrafted) return false;
    if (pos !== 'all' && p.pos !== pos) return false;
    if (search) {
      const hay = (p.player + ' ' + p.team + ' ' + p.pos).toLowerCase();
      if (!hay.includes(search)) return false;
    }
    return true;
  });

  if (filtered.length === 0) {
    tbody.innerHTML = `<tr><td colspan="8"><div class="empty-state"><i class="fas fa-clipboard-question"></i>No players match those filters. Try widening your search.</div></td></tr>`;
  } else {
    tbody.innerHTML = filtered.map(p => {
      const isDrafted = drafted.has(p.player);
      const isSleeper = SLEEPER_NAMES.has(p.player);
      const note = isSleeper ? '<i class="fas fa-star sleeper-flag"></i> Sleeper' : '';
      return `
        <tr class="${isDrafted ? 'is-drafted' : ''}">
          <td><input type="checkbox" class="draft-check" data-name="${p.player.replace(/"/g,'&quot;')}" ${isDrafted ? 'checked' : ''} /></td>
          <td><span class="pos-badge pos-${p.pos}">${p.pos}</span></td>
          <td><span class="player-name">${p.player}</span></td>
          <td>${p.team}</td>
          <td class="num">${p.rank}</td>
          <td class="num">${p.pts.toFixed(1)}</td>
          <td class="num">${p.ppg.toFixed(1)}</td>
          <td>${note}</td>
        </tr>
      `;
    }).join('');
  }

  const total = PLAYERS.length;
  const draftedTotal = PLAYERS.filter(p => drafted.has(p.player)).length;
  totalCount.textContent = total;
  draftedCount.textContent = draftedTotal;
  undraftedCount.textContent = total - draftedTotal;
  sleeperCount.textContent = PLAYERS.filter(p => SLEEPER_NAMES.has(p.player) && drafted.has(p.player)).length;
  lastUpdated.textContent = 'Updated ' + new Date().toLocaleTimeString();

  tbody.querySelectorAll('.draft-check').forEach(cb => {
    cb.addEventListener('change', function () {
      setPlayerDrafted(this.dataset.name, this.checked);
    });
  });
}

searchInput.addEventListener('input', render);
filterStatus.addEventListener('change', render);
filterPos.addEventListener('change', render);
resetBtn.addEventListener('click', () => {
  if (confirm('Clear every drafted mark on the board? This affects all pages.')) {
    resetDraftedSet();
  }
});
onDraftStoreChange(render);
render();
</script>
</body>
</html>
